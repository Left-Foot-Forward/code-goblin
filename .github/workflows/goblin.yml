name: Goblin

# One workflow, one job, one queue: runs never overlap, so the ledger is never written twice at once.
# Every run also processes every open "goblin:" issue, so a run GitHub skips loses nothing.
on:
  schedule:
    - cron: "17 */2 * * *"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: goblin
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'goblin:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Recommended: a GitHub App so the goblin can read the whole org (set GOBLIN_APP_ID and GOBLIN_APP_KEY).
      - id: app
        if: vars.GOBLIN_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GOBLIN_APP_ID }}
          private-key: ${{ secrets.GOBLIN_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the goblin
        env:
          # Reads the org: the App token, else a fine-grained token in GOBLIN_TOKEN, else this repo only.
          GOBLIN_TOKEN: ${{ steps.app.outputs.token || secrets.GOBLIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GOBLIN_SALT: ${{ secrets.GOBLIN_SALT }}
        run: node scripts/goblin.mjs
