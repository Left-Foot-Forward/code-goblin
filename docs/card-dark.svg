<style>
 .g-figure{transform-box:fill-box;transform-origin:50% 100%;animation:g-breathe 3.6s ease-in-out infinite}
 .g-ear-l{transform-box:fill-box;transform-origin:100% 60%;animation:g-twitch 7s ease-in-out infinite}
 .g-ear-r{transform-box:fill-box;transform-origin:0% 60%;animation:g-twitch 7s ease-in-out infinite 3.1s}
 .g-lids rect{animation:g-blink 5.5s infinite}
 .g-pink{animation:g-misreg 9s steps(3) infinite}
 .g-code{stroke-dasharray:60;animation:g-type 2.4s steps(6) infinite}
 .g-halo{transform-box:fill-box;transform-origin:50% 50%;animation:g-spin 14s linear infinite}
@keyframes g-breathe{50%{transform:scale(1.012,.985)}}
@keyframes g-twitch{0%,92%,100%{transform:rotate(0)}95%{transform:rotate(-7deg)}97%{transform:rotate(3deg)}}
@keyframes g-blink{0%,94%,100%{height:0}96%{height:24px}}
@keyframes g-misreg{0%,100%{translate:0 0}33%{translate:.6px .4px}66%{translate:-.4px .7px}}
@keyframes g-type{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes g-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important}}</style>
